version: "3.9"

services:
  app:
    build: .
    container_name: coylejax-frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules_data:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped
#     command: >
#       sh -c "npx chokidar-cli 'package.json' -c 'npm install' & npm run dev"

volumes:
  node_modules_data:
